{% extends 'base.html' %}{% block content %}
<div class="authbox"><h1>Welcome back</h1>
<form method="post" novalidate>{{ form.hidden_tag() }}
  <label>{{ form.email.label }}{{ form.email(autocomplete='username', autofocus=true) }}{% for e in form.email.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>
  <label>{{ form.password.label }}{{ form.password(autocomplete='current-password') }}{% for e in form.password.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>
  <label class="check">{{ form.remember() }} {{ form.remember.label.text }}</label>
  {{ form.submit(class='btn primary full') }}
</form>
<p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</div>{% endblock %}
