{% extends 'base.html' %}{% block content %}<div class="authbox"><h1>Create your Findora account</h1><form method="post">{{form.hidden_tag()}}{% for f in [form.name,form.email,form.phone,form.organization_id,form.password,form.confirm] %}<label>{{f.label}}{{f()}}{% for e in f.errors %}<small class="error">{{e}}</small>{% endfor %}</label>{% endfor %}{{form.submit(class='btn primary full')}}</form></div>{% endblock %}
