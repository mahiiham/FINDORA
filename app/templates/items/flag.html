{% extends 'base.html' %}{% import '_macros.html' as mac %}{% block content %}<div class="authbox"><h1>Flag report</h1><div class="card row slim item-strip">{{ mac.photo(item,'rowthumb') }}<div><span class="badge {{ item.item_type|lower }}">{{ item.item_type }}</span> <strong>{{ item.title }}</strong><p class="muted">{{ item.category.name }} · {{ item.location.name }}</p></div></div><form method="post">{{form.hidden_tag()}}<label>{{form.reason.label}}{{form.reason()}}</label>{{form.submit(class='btn danger')}}</form></div>{% endblock %}
